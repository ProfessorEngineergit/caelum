name: Android APK

# Builds the installable APK (Caelum.apk).
#   • Called by release.yml, so every release carries it.
#   • On a push to main that touches the Android app, or by hand, it also attaches
#     the APK to the latest release, so
#     https://github.com/ProfessorEngineergit/caelum/releases/latest/download/Caelum.apk
#     always works.
#
# Signing: with the repository secrets below the APK gets a fixed key, so updates install
# over each other. Without them it is signed with a throw-away debug key, and a newer APK
# can only be installed after uninstalling the old one.
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", "desktop/src/main/galleries.json", ".github/workflows/android-apk.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: echo "version=$(python3 -c "import plistlib; print(plistlib.load(open('Resources/Info.plist','rb'))['CFBundleShortVersionString'])")" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/caelum.jks"
            echo "CAELUM_KEYSTORE_FILE=$RUNNER_TEMP/caelum.jks" >> "$GITHUB_ENV"
            echo "CAELUM_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "CAELUM_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "CAELUM_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key configured - signing with a throw-away debug key."
          fi

      - name: Build
        working-directory: android
        run: |
          ./gradlew :core:test :app:assembleRelease -PappVersion=${{ steps.version.outputs.version }} --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Caelum.apk"

      - name: Check the APK
        run: |
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs Caelum.apk | head -3
          sha256sum Caelum.apk
          ls -l Caelum.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Caelum.apk
          if-no-files-found: error

  attach:
    # Only when run on its own; release.yml publishes the APK together with the rest.
    if: github.event_name != 'workflow_call'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android

      - name: Attach to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          gh release upload "$TAG" Caelum.apk --clobber --repo "$GITHUB_REPOSITORY"
          echo "Attached Caelum.apk to $TAG" >> "$GITHUB_STEP_SUMMARY"
