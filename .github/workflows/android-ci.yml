name: Android CI

# Builds the Android app and runs the source tests on every change to it.
on:
  push:
    paths: ["android/**", "desktop/src/main/galleries.json", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["android/**", "desktop/src/main/galleries.json", ".github/workflows/android-ci.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Source tests
        run: ./gradlew :core:test --stacktrace
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: caelum-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
